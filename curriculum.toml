# curriculum.toml — the machine-readable registry for the playbook.
#
# This is the single place an orchestrator reads to know WHAT exists and WHERE it is.
# Rules:
#   * Concept ids (c01..c30) are permanent. Never renumber. New concepts get the next free id.
#   * `week` is the roadmap slot (week 1 starts on [schedule].start). Reordering the roadmap
#     means editing `week`, never the id.
#   * `stage` is the only progress field. Allowed values, in order:
#       queued -> drafted -> proven -> mastered -> published
#     `tools/playbook.py validate` refuses a stage whose gate files are missing (see CLAUDE.md §4).
#   * Only Meet moves a concept to `mastered` (after a /challenge session). Automation never does.
#   * `ai_question` is the production AI problem this concept answers. Every concept is taught
#     as "the classic mechanism that governs this AI-era problem" (see ROADMAP.md).
#   * `requires` lists concept ids whose ideas this concept builds on (used to order work and
#     to tell DEEP_DIVE which existing notes to link back to).

[schedule]
start = 2026-11-30          # Monday of roadmap week 1
wip_limit = 2               # max concepts in drafted/proven at once (backpressure on automation)

[[modules]]
id = "m0"
slug = "m0-foundations"
title = "Foundations: the Basics Everyone Skips"

[[modules]]
id = "m1"
slug = "m1-storage-and-data"
title = "Storage, Data & State"

[[modules]]
id = "m2"
slug = "m2-distributed-coordination"
title = "Distributed Coordination & Consistency"

[[modules]]
id = "m3"
slug = "m3-async-and-backpressure"
title = "Async Messaging & Backpressure"

[[modules]]
id = "m4"
slug = "m4-reliability-and-guardrails"
title = "Reliability & Production Guardrails"

[[modules]]
id = "m5"
slug = "m5-network-and-edge"
title = "Network, Caching & Edge"

[[modules]]
id = "m6"
slug = "m6-ai-agent-systems"
title = "Agentic & AI System Architecture"

