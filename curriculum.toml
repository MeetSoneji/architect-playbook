# curriculum.toml — the machine-readable registry for the playbook.
#
# This is the single place an orchestrator reads to know WHAT exists and WHERE it is.
# Rules:
#   * Concept ids (c01..c30) are permanent. Never renumber. New concepts get the next free id.
#   * `seq` is the one serial order everything is produced in: similar concepts sit together in a
#     `track`, and each track ends with real-world case studies (`kind = "case-study"`).
#     Reordering means editing `seq`, never the id. Dates come from seq and [schedule].
#   * `stage`: queued -> drafted (notes) -> published (notes + post + video). Automation drives it.
#   * `mastered = true` is set only by Meet, after a /challenge session. It never blocks automation.
#   * `ai_question` is the production AI problem this concept answers. Every concept is taught
#     as "the classic mechanism that governs this AI-era problem" (see ROADMAP.md).
#   * `requires` lists concept ids whose ideas this concept builds on (used to order work and
#     to tell DEEP_DIVE which existing notes to link back to).

[schedule]
start = 2026-11-30          # Monday of the first release
days = ["Mon", "Thu"]       # two concepts a week, 07:00 IST (Asia/Kolkata)
timezone = "Asia/Kolkata"

# Tracks group similar concepts so understanding builds gradually. Each ends with case studies.
[[tracks]]
id = "t1"
title = "Foundations: the basics everyone skips"

[[tracks]]
id = "t2"
title = "Storage and state"

[[tracks]]
id = "t3"
title = "One request, done right: messaging and reliability"

[[tracks]]
id = "t4"
title = "Agreement under partial failure"

[[tracks]]
id = "t5"
title = "Edge, caching and streaming"

[[tracks]]
id = "t6"
title = "Seeing and budgeting production"

[[tracks]]
id = "t7"
title = "Agents as distributed systems"

